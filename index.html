<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso 💙</title>
    <style>
        body {
            background: linear-gradient(to right, #72b2ff, #8ec2f8);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
        }

        .login {
            background: rgba(255,255,255,0.2);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #4b7bff;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="login">
    <h2>💙 Solo para ti 💙</h2>
    <p>Ingresa nuestra fecha 00/00/0000</p>

    <input type="password" id="password" placeholder="Contraseña">
    <br>
    <button onclick="login()">Entrar</button>

    <p id="error" style="color:red; display:none;">Contraseña incorrecta 😢</p>
</div>

<script>
    function login() {
        const pass = document.getElementById("password").value;

        // 🔑 Cambia esto por tu clave
        if (pass === "13/03/2025") {
            window.location.href = "carta.html";
        } else {
            document.getElementById("error").style.display = "block";
        }
    }
</script>

</body>
</html>
